  <body>
    <div id="root"></div>
    <script>
      // Suprime avisos inofensivos de conexão WebSocket do HMR no ambiente de iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason?.message).includes('WebSocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
          event.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
